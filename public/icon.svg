<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Matrix Accent Gradients -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Matrix Grid Boundary -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Matrix Glowing Grid Lines -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.18">
    <line x1="96" y1="56" x2="96" y2="400" />
    <line x1="176" y1="56" x2="176" y2="400" />
    <line x1="256" y1="56" x2="256" y2="400" />
    <line x1="336" y1="56" x2="336" y2="400" />
    <line x1="416" y1="56" x2="416" y2="400" />

    <line x1="56" y1="96" x2="456" y2="96" />
    <line x1="56" y1="176" x2="456" y2="176" />
    <line x1="56" y1="256" x2="456" y2="256" />
    <line x1="56" y1="336" x2="456" y2="336" />
  </g>

  <!-- Cybernetic Matrix Diamond Outer Frame -->
  <path d="M 256 56 L 436 220 L 256 384 L 76 220 Z" 
        fill="none" 
        stroke="url(#cyanEmerald)" 
        stroke-width="7" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <path d="M 256 88 L 400 220 L 256 352 L 112 220 Z" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="2.5" 
        stroke-dasharray="6 6" />

  <!-- Core Matrix Nodes (Financial Grid Intersections) -->
  <g fill="#10b981" filter="url(#glow)">
    <circle cx="256" cy="56" r="8" fill="#06b6d4" />
    <circle cx="436" cy="220" r="8" fill="#10b981" />
    <circle cx="256" cy="384" r="8" fill="#3b82f6" />
    <circle cx="76" cy="220" r="8" fill="#06b6d4" />

    <circle cx="176" cy="150" r="5" fill="#38bdf8" opacity="0.85" />
    <circle cx="336" cy="150" r="5" fill="#34d399" opacity="0.85" />
    <circle cx="176" cy="290" r="5" fill="#818cf8" opacity="0.85" />
    <circle cx="336" cy="290" r="5" fill="#38bdf8" opacity="0.85" />
  </g>

  <!-- Central Vertical Matrix Core Beam -->
  <g filter="url(#strongGlow)">
    <line x1="256" y1="110" x2="256" y2="330" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
    <line x1="256" y1="110" x2="256" y2="330" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Central Dynamic "F" & "M" Geometric Currency Ribbon -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main S-Curve / FM Matrix Currency Flow -->
    <path d="M 188 150 C 188 120, 224 112, 256 112 C 304 112, 332 134, 332 164 C 332 198, 276 210, 256 218 C 214 232, 180 244, 180 280 C 180 312, 212 328, 256 328 C 296 328, 324 312, 324 290" 
          stroke="url(#goldGrad)" 
          stroke-width="22" 
          filter="url(#glow)"/>

    <!-- Inner Highlight for Vector Precision -->
    <path d="M 188 150 C 188 120, 224 112, 256 112 C 304 112, 332 134, 332 164 C 332 198, 276 210, 256 218 C 214 232, 180 244, 180 280 C 180 312, 212 328, 256 328 C 296 328, 324 312, 324 290" 
          stroke="#ffffff" 
          stroke-width="6" 
          opacity="0.95"/>

    <!-- Matrix Dual Crossbars -->
    <line x1="168" y1="180" x2="344" y2="180" stroke="url(#cyanEmerald)" stroke-width="10" filter="url(#glow)" />
    <line x1="168" y1="256" x2="344" y2="256" stroke="url(#cyanEmerald)" stroke-width="10" filter="url(#glow)" />
    
    <line x1="176" y1="180" x2="336" y2="180" stroke="#ffffff" stroke-width="3" />
    <line x1="176" y1="256" x2="336" y2="256" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Digital Data Pulse Points -->
  <circle cx="168" cy="180" r="5" fill="#38bdf8" />
  <circle cx="344" cy="180" r="5" fill="#10b981" />
  <circle cx="168" cy="256" r="5" fill="#818cf8" />
  <circle cx="344" cy="256" r="5" fill="#38bdf8" />

  <!-- App Title Label: Fin Matrix -->
  <g id="app-label">
    <!-- Background Pill for Title -->
    <rect x="96" y="420" width="320" height="52" rx="26" fill="#090e1a" stroke="url(#cyanEmerald)" stroke-width="2" opacity="0.95"/>
    <text x="256" y="455" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="3.5" 
          text-anchor="middle" 
          fill="url(#textGrad)">FIN MATRIX</text>
  </g>
</svg>
